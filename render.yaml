services:
  - type: web
    name: ahjin-game-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SIMSIMI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
